# Release Python SDK — ABI3 wheels per ADR-002 §5.
#
# Triggered manually (workflow_dispatch) or on a tag matching
# `python-v*` (e.g. python-v2.2.0). Builds five wheels:
# - manylinux_2_28 x86_64
# - manylinux_2_28 aarch64
# - macOS x86_64 (Intel)
# - macOS aarch64 (Apple Silicon)
# - Windows x86_64
# - sdist (always)
#
# PyPI credentials come from GCP Secret Manager (cognitum-20260110/PYPI_TOKEN)
# through keyless Workload Identity Federation: pool `github-ruvnet-ci`,
# provider `rulake`, service account `ci-rulake`. No PyPI secret is stored
# in GitHub. The provider only admits this workflow on tag pushes and
# workflow_dispatch from the default branch.
#
# Every run (tag or dispatch, publish or not) runs the `pypi-auth` job,
# which fetches the token and proves PyPI accepts it without uploading
# anything. Publishing still needs a `python-v*` tag or publish=true.

name: release-python

on:
  push:
    tags:
      - "python-v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to PyPI"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  PACKAGE_DIR: sdk/python

jobs:
  build:
    name: build (${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-gnu,  manylinux: 2_28, name: linux-x86_64 }
          - { os: ubuntu-latest,    target: aarch64-unknown-linux-gnu, manylinux: 2_28, name: linux-aarch64 }
          # macos-13 (the last Intel image) is retired; cross-compile the
          # Intel wheel on Apple Silicon instead.
          - { os: macos-14,         target: x86_64-apple-darwin,                       name: macos-x86_64 }
          - { os: macos-14,         target: aarch64-apple-darwin,                      name: macos-aarch64 }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,                    name: windows-x86_64 }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel via maturin-action
        uses: PyO3/maturin-action@v1
        with:
          working-directory: ${{ env.PACKAGE_DIR }}
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux || 'auto' }}
          args: --release --out dist
          # ADR-002 requires ABI3-py39: one wheel per platform per release.
          # `extension-module` is set in pyproject.toml.
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.platform.name }}
          path: ${{ env.PACKAGE_DIR }}/dist/*.whl

  sdist:
    name: build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive    # critical — pyproject.toml [tool.maturin].include pulls vendored sources
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: ${{ env.PACKAGE_DIR }}
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: ${{ env.PACKAGE_DIR }}/dist/*.tar.gz

  pypi-auth:
    # Auth smoke: fetch PYPI_TOKEN via GCP WIF and confirm PyPI accepts it,
    # without uploading. PyPI's legacy upload endpoint authenticates before
    # it validates the form, so an empty file_upload POST answers 400 for a
    # valid token and 403 for a bad one.
    name: PyPI auth smoke (GCP WIF)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/186366152200/locations/global/workloadIdentityPools/github-ruvnet-ci/providers/rulake
          service_account: ci-rulake@cognitum-20260110.iam.gserviceaccount.com
      - id: gsm
        uses: google-github-actions/get-secretmanager-secrets@v2
        with:
          secrets: |-
            pypi:cognitum-20260110/PYPI_TOKEN
      - name: Verify PyPI accepts the token (no upload)
        env:
          PYPI_TOKEN: ${{ steps.gsm.outputs.pypi }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' -u "__token__:${PYPI_TOKEN}" \
            -F ':action=file_upload' -F 'protocol_version=1' https://upload.pypi.org/legacy/)
          case "$code" in
            400) echo "PyPI authenticated the token (400 = auth OK, empty form rejected)" ;;
            403) echo "::error::PyPI rejected PYPI_TOKEN from GCP Secret Manager (403)"; exit 1 ;;
            *)   echo "::error::unexpected PyPI response ${code}"; exit 1 ;;
          esac

  publish:
    name: publish to PyPI
    needs: [build, sdist, pypi-auth]
    runs-on: ubuntu-latest
    # Only publish on tag push or explicit workflow_dispatch with publish=true.
    if: |
      startsWith(github.ref, 'refs/tags/python-v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true')
    environment:
      name: pypi
      url: https://pypi.org/p/rulake
    permissions:
      contents: read
      id-token: write       # GCP Workload Identity Federation
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/186366152200/locations/global/workloadIdentityPools/github-ruvnet-ci/providers/rulake
          service_account: ci-rulake@cognitum-20260110.iam.gserviceaccount.com
      - id: gsm
        uses: google-github-actions/get-secretmanager-secrets@v2
        with:
          secrets: |-
            pypi:cognitum-20260110/PYPI_TOKEN
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: twine check
        run: |
          python -m pip install --upgrade twine
          python -m twine check --strict dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          password: ${{ steps.gsm.outputs.pypi }}
          skip-existing: true
