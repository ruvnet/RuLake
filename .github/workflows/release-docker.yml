# Release the rulake-mcp Docker image to GHCR.
#
# Triggered manually or on tag `mcp-v*`. Builds the distroless image
# defined by Dockerfile.mcp and pushes:
#   ghcr.io/ruvnet/rulake-mcp:<tag>     (e.g. mcp-v0.3.0)
#   ghcr.io/ruvnet/rulake-mcp:latest    (on tag push, not workflow_dispatch)
#
# Uses the GITHUB_TOKEN's packages:write scope — no extra secrets needed.

name: release-docker

on:
  push:
    tags:
      - "mcp-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (default: dev)"
        type: string
        default: dev

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/rulake-mcp

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.event.inputs.tag || 'latest' }},enable=${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/mcp-v') }}
            type=match,pattern=mcp-v(.*),group=1
            type=sha,prefix=sha-
      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.mcp
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
