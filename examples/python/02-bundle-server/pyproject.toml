[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rulake-bundle-server"
version = "0.1.0"
description = "FastAPI server that publishes ruLake bundle sidecars over HTTP."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "ruLake Python examples" }]
license = { text = "Apache-2.0 OR MIT" }

dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "watchdog>=4.0",
    "rulake-verify-witness",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "httpx>=0.27", "mypy>=1.8"]

[project.scripts]
rulake-bundle-server = "server:main"
rulake-bundle-publish = "publish:main"

[tool.setuptools]
py-modules = ["server", "publish"]

[tool.uv.sources]
rulake-verify-witness = { path = "../01-verify-witness", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.11"
