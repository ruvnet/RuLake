[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rulake-subprocess-wrapper"
version = "0.1.0"
description = "Spawn-and-parse Python wrapper around the rulake-demo Rust binary."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "ruLake Python examples" }]
license = { text = "Apache-2.0 OR MIT" }

# No runtime deps — subprocess + re + dataclasses cover this.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4", "mypy>=1.8"]

[project.scripts]
rulake-bench = "rulake:main"
rulake-demo-py = "demo:main"

[tool.setuptools]
py-modules = ["rulake", "demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.11"
