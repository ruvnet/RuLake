[package]
name = "rulake-bundle-toolkit"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "ruLake bundle utilities, sandboxed inside wasm32-wasi (verify, dump, witness)"
publish = false

# Standalone — keeps wasm32-wasi build off the host workspace.
[workspace]

[[bin]]
name = "bundle-toolkit"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha3 = "0.10"
hex = "0.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
